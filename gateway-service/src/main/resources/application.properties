spring.application.name=gateway-service
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=account-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/account/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/transaction/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
