server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /account/ {
        proxy_pass http://gateway-service:9999;
        proxy_set_header Host $host;
    }

    location /transaction/ {
        proxy_pass http://gateway-service:9999;
        proxy_set_header Host $host;
    }

    location /agent/ {
        proxy_pass http://gateway-service:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
