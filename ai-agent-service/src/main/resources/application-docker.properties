eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.mcp.client.streamable-http.connections.account-service.url=http://account-service:8081/mcp
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=http://transaction-service:8082/mcp
