spring.application.name=ai-agent-service
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:gpt-oss:120b-cloud}

spring.ai.mcp.client.streamable-http.connections.account-service.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=http://localhost:8082/mcp

telegram.bot-username=AdriaDouyryBot
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
spring.config.import=optional:classpath:application-secret.properties
