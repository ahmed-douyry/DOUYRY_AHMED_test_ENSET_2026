name: Intégration et livraison

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilation
        run: ./mvnw -B -ntp -DskipTests compile
      - name: Tests
        run: ./mvnw -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Compilation et tests du client
        working-directory: frontend-angular
        run: npm ci && npm test -- --watch=false && npx ng build --configuration=production

  publication:
    name: Image et registre
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: discovery-service
            context: .
            build-args: MODULE=discovery-service
          - service: config-service
            context: .
            build-args: MODULE=config-service
          - service: account-service
            context: .
            build-args: MODULE=account-service
          - service: transaction-service
            context: .
            build-args: MODULE=transaction-service
          - service: ai-agent-service
            context: .
            build-args: MODULE=ai-agent-service
          - service: gateway-service
            context: .
            build-args: MODULE=gateway-service
          - service: frontend
            context: frontend-angular
            build-args: MODULE=frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/testadria-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/testadria-${{ matrix.service }}:latest

  deploiement:
    name: Déploiement
    needs: publication
    runs-on: ubuntu-latest
    steps:
      - name: Déployer la pile
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Étape schématique : aucun cluster cloud n'est contacté."
          echo "Sur la machine cible, avec le tag ${IMAGE_TAG} :"
          echo "  docker compose pull"
          echo "  IMAGE_TAG=${IMAGE_TAG} docker compose up -d"
          echo "Rollback : IMAGE_TAG=<sha-précédent> docker compose up -d"
