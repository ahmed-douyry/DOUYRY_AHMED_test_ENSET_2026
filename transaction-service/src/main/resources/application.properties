spring.application.name=transaction-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql

spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

bank.transaction.max-amount=1000
bank.account-service.url=http://localhost:8081

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.account-service.connectTimeout=2000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000

resilience4j.circuitbreaker.configs.account-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.account-service.sliding-window-size=10
resilience4j.circuitbreaker.configs.account-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.account-service.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.account-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.account-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.account-service.ignore-exceptions=org.example.transactionservice.service.InvalidTransactionException,org.example.transactionservice.service.AccountNotFoundException

resilience4j.timelimiter.configs.account-service.timeout-duration=3s
resilience4j.timelimiter.configs.account-service.cancel-running-future=true

resilience4j.retry.instances.accountServiceRead.max-attempts=3
resilience4j.retry.instances.accountServiceRead.wait-duration=150ms
resilience4j.retry.instances.accountServiceRead.retry-exceptions=org.example.transactionservice.service.AccountServiceUnavailableException
